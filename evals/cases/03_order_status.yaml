# "Where is my order?" Expected: report the carrier status (no refund, no escalation).
- id: status-01
  split: dev
  tags: [status]
  order: {id: ord_e201, status: shipped, paid: 159900, product: Bluetooth Speaker,
          shipment: {status: in_transit, eta_days: 2}}
  form_order: ord_e201
  message: Where is my speaker? It hasn't arrived.
  gold: {category: order_status, order_id: ord_e201}
  expect: {route: report_order_status, reason: order_status}
