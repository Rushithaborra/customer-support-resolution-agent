# Eligible refunds: return received, inspection passed, inside the window.
# Code decides the amount; the model must not change it. Expected: a proposal for the full paid amount.
- id: elig-01
  split: dev
  tags: [refund, eligible]
  order: {id: ord_e001, status: delivered, paid: 249900, product: Wireless Headphones, delivered_days_ago: 12,
          return: {status: received, received_days_ago: 3, inspection: passed}}
  form_order: ord_e001
  message: I returned my headphones last week but haven't got my refund.
  gold: {category: refund_request, order_id: ord_e001}
  expect: {route: propose_refund, reason: eligible, amount_minor: 249900}
